<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LUXE Store — Productos premium seleccionados para vos." />
    <title>LUXE Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <header>
      <nav class="navbar navbar-expand-lg luxe-navbar fixed-top" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand luxe-brand" href="#"><span class="brand-pre">✦</span> LUXE</a>
          <button class="navbar-toggler luxe-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="#products-section">Productos</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <section class="luxe-hero" aria-label="Sección principal">
      <div class="hero-bg-overlay"></div>
      <div class="container hero-content text-center">
        <p class="hero-eyebrow">Nueva colección</p>
        <h1 class="hero-title">Calidad que <em>se siente</em></h1>
        <p class="hero-subtitle">Explorá nuestra selección de productos premium,<br />curados para un estilo de vida extraordinario.</p>
        <a href="#products-section" class="btn luxe-btn-primary">Ver productos</a>
      </div>
    </section>

    <main id="products-section">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title">Todos los productos</h2>
        </div>
        <div class="row g-4" id="productsGrid" aria-label="Listado de productos"></div>
      </div>
    </main>

    <footer class="luxe-footer" role="contentinfo">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
            <span class="footer-brand">✦ LUXE</span>
          </div>
          <div class="col-md-4 text-center mb-3 mb-md-0">
            <p class="footer-tagline">Diseñado con cuidado. Entregado con excelencia.</p>
          </div>
          <div class="col-md-4 text-center text-md-end">
            <p class="footer-copy">&copy; <span id="footerYear"></span> LUXE Store</p>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('footerYear').textContent = new Date().getFullYear();
    </script>

  </body>
</html>
